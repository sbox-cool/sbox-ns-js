sourceVersion: 1
kind: endpoint
id: secret-probe
slug: secret-probe
name: Secret probe
method: POST
enabled: true
requiresSecretKey: false
exposure: public
runtime: javascript
script: |
  export default function handle(req, ns) {
    return { ok: true, token: ns.secrets.get("shared_token"), missing: ns.secrets.get("shared_unset") };
  }
